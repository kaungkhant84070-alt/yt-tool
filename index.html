<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>YT Downloader</title>
    <style>
        body { font-family: Arial; background: #121212; color: white; text-align: center; padding-top: 50px; }
        .box { background: #1e1e1e; padding: 30px; border-radius: 15px; display: inline-block; width: 80%; max-width: 400px; }
        h2 { color: #ff0000; }
        input { width: 90%; padding: 12px; margin: 15px 0; border-radius: 8px; border: none; font-size: 16px; }
        button { padding: 12px 30px; background: #ff0000; color: white; border: none; border-radius: 8px; font-size: 18px; font-weight: bold; }
        #loading { display: none; color: #ffeb3b; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="box">
        <h2>🎬 YouTube Downloader</h2>
        <p>YouTube Link ထည့်ပြီး ဒေါင်းလုပ်ပါ</p>
        <form action="/download" method="post" onsubmit="document.getElementById('loading').style.display='block';">
            <input type="text" name="url" placeholder="https://youtu.be/..." required>
            <br>
            <button type="submit">Download</button>
        </form>
        <div id="loading">⏳ ဒေါင်းလုပ် လုပ်နေပါသည်...</div>
    </div>
</body>
</html>
